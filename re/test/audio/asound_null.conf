# Private ALSA configuration for the audio-on Wine targets of the harness.
# Selected only through ALSA_CONFIG_PATH in the environment of the Wine process: it replaces
# the system alsa.conf for that process, so no system-wide audio setting changes. The one
# default PCM is the "null" plugin: it accepts samples and discards them, so the game's
# DirectSound runs with a real driver and nothing reaches a speaker or PipeWire/PulseAudio.
pcm.!default {
    type null
}
